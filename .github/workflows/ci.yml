name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ".[dev,serving]"
      - run: ruff check .
      - run: pytest -q
      - run: docker build -f docker/Dockerfile.api -t thaiair-api .
      - name: Smoke-test the self-contained image
        run: |
          docker run -d --name thaiair-api -p 8000:8000 thaiair-api
          for attempt in {1..30}; do
            curl -fsS http://localhost:8000/ready && break
            test "$attempt" -lt 30 || { docker logs thaiair-api; exit 1; }
            sleep 1
          done
          curl -fsS http://localhost:8000/ | grep -q ThaiAir
          curl -fsS http://localhost:8000/stations | grep -q 'oa:135:5077838'
          curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"station_id":"oa:135:5077838"}'
          docker rm -f thaiair-api
