name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ".[dev,serving]"
      - run: ruff check .
      - run: pytest -q
      - run: docker build -f docker/Dockerfile.api -t thaiair-api .
      - name: Smoke-test the self-contained image
        run: |
          docker run -d --name thaiair-api -p 8000:8000 thaiair-api
          for attempt in {1..30}; do
            curl -fsS http://localhost:8000/ready && break
            test "$attempt" -lt 30 || { docker logs thaiair-api; exit 1; }
            sleep 1
          done
          curl -fsSI http://localhost:8000/ | grep -qi 'location: https://thaiair-web.vercel.app'
          curl -fsS http://localhost:8000/map-data | grep -q available_horizons
          curl -fsS http://localhost:8000/stations | grep -q 'oa:135:5077838'
          curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"station_id":"oa:135:5077838"}'
          docker rm -f thaiair-api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
