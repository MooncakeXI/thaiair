[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thaiair"
requires-python = ">=3.11"


dynamic = ["version"]

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.version]
path = "src/thaiair/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/thaiair"]

[tool.pytest.ini_options]
markers = [
    "live: ยิง API จริง — ไม่รันโดยปริยาย ใช้ `pytest -m live`",
]
addopts = "-m 'not live'"